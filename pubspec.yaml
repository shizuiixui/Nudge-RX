name: nudge_rx
description: "A smart, user-centric medication tracking and reminder application."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_dotenv: ^6.0.1
  google_generative_ai: ^0.4.7
  image_picker: ^1.2.3
  camera: ^0.11.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/App_logo.png"
  adaptive_icon_background: "#FFFFFF" 


flutter:
  uses-material-design: true

  # Images
  assets:
    - assets/images/
    - assets/images/navbar/
    - assets/images/AddMedicine/
    - .env
  
  # Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
    
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter_18pt-Bold.ttf
          weight: 700

    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans/NotoSans-Regular.ttf
          weight: 400
